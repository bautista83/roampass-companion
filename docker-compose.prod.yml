# Despliegue de RoamPass en el servidor (vm-dev-web).
# Usa el PostgreSQL compartido (contenedor "postgres" en la red externa "dev-net").
# Uso, desde la raiz del repo en el servidor:  docker compose up -d --build
# (el .env de la raiz define COMPOSE_FILE=docker-compose.prod.yml)
name: roampass

services:
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.server
    image: roampass-api
    container_name: roampass-api
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "4000"
    # Solo localhost: desde fuera se entra por el Nginx de la VM.
    ports:
      - "127.0.0.1:4100:4000"
    networks:
      - dev-net

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.client
      args:
        VITE_API_URL: /api
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
    image: roampass-web
    container_name: roampass-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:3100:80"

networks:
  dev-net:
    external: true
