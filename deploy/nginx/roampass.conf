# Nginx NATIVO de la VM (reverse proxy). Copiar a /etc/nginx/sites-available/roampass
# y enlazar en sites-enabled. Roamle queda en http://<ip-o-nombre-de-la-vm>:8080
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    client_max_body_size 2m;

    # API: se mantiene el prefijo /api (Express monta las rutas en /api/...).
    location /api/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Tiempo real de las partidas online (Socket.IO): WebSocket hacia la API.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Las conexiones quedan abiertas toda la partida.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Cliente (contenedor Nginx con la SPA).
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
    }
}
