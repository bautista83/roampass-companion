# Nginx DENTRO del contenedor del cliente: sirve la SPA compilada.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Archivos con hash en el nombre: se pueden cachear para siempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Verificacion de la app para celulares (App Links / Universal Links, docs/specs/mobile-app.md D11):
    # siempre JSON y, si falta el archivo, 404 (nunca index.html).
    location /.well-known/ {
        default_type application/json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Rutas de React Router (/login, /play...): siempre devuelven index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
