<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 88" width="88" height="88">
  <!-- RoamPass: mapa sticker con pasaporte, avion, barco y tren (mismo estilo que el tablero) -->
  <defs>
    <clipPath id="rp-card"><rect x="3" y="3" width="76" height="76" rx="18"/></clipPath>
  </defs>
  <g stroke="#111111" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <rect x="9" y="9" width="76" height="76" rx="18" fill="#111111"/>
    <rect x="3" y="3" width="76" height="76" rx="18" fill="#7ec4f5"/>
    <g clip-path="url(#rp-card)">
      <!-- tierras -->
      <path d="M-4 30 Q2 16 13 18 Q19 8 30 11 Q38 14 34 22 Q28 28 18 27 Q9 34 -4 34 Z" fill="#a8dc9a"/>
      <path d="M42 86 Q40 66 53 60 Q66 54 84 58 V86 Z" fill="#ffe38f"/>
      <path d="M56 32 Q59 26 66 27 Q72 30 69 36 Q64 40 58 38 Q54 36 56 32 Z" fill="#ffbfd9"/>
      <!-- olas -->
      <path d="M8 44 q3 -3 6 0 t6 0" fill="none" stroke="#a9d8fa" stroke-width="2.4"/>
      <path d="M44 48 q3 -3 6 0 t6 0" fill="none" stroke="#a9d8fa" stroke-width="2.4"/>
      <!-- ruta del viaje -->
      <path d="M22 60 Q32 66 44 57 Q53 50 58 40 Q62 30 62 22" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-dasharray="3.5 4.5"/>
      <!-- barco -->
      <g transform="translate(6 54)" stroke-width="2.4">
        <path d="M0 8 H18 L15.5 13 H2.5 Z" fill="#ff8a6b"/>
        <rect x="4" y="3" width="9" height="5" fill="#ffffff"/>
        <rect x="9" y="-2" width="3" height="5" fill="#ff5a5a"/>
        <path d="M-2 17 q3 -2.5 6 0 t6 0 t6 0" fill="none" stroke="#a9d8fa"/>
      </g>
      <!-- tren -->
      <g transform="translate(50 61)" stroke-width="2.4">
        <rect x="2" y="-4" width="3" height="4" fill="#ff8a6b"/>
        <rect x="0" y="0" width="11" height="9" rx="1.5" fill="#ff8a6b"/>
        <rect x="2.5" y="2" width="4" height="3" fill="#ffffff" stroke-width="1.6"/>
        <rect x="12" y="3" width="12" height="6" rx="1.5" fill="#7ec4f5"/>
        <circle cx="4" cy="11" r="2" fill="#111111" stroke-width="1.4"/>
        <circle cx="9" cy="11" r="2" fill="#111111" stroke-width="1.4"/>
        <circle cx="16" cy="11" r="2" fill="#111111" stroke-width="1.4"/>
        <circle cx="21" cy="11" r="2" fill="#111111" stroke-width="1.4"/>
        <path d="M-4 14 H30" fill="none" stroke-width="2"/>
      </g>
      <!-- avion -->
      <g transform="translate(51 6) rotate(22) scale(0.95)" stroke-width="2.4">
        <path d="M2 10 L12 9 L16 1 H19 L18 9 L25 9 Q28 10.5 25 12 L18 12 L19 20 H16 L12 13 L2 12 Z" fill="#ffffff"/>
      </g>
    </g>
    <!-- pasaporte -->
    <g transform="translate(22 24) rotate(-8)" stroke-width="2.6">
      <rect x="3" y="3" width="22" height="29" rx="4" fill="#111111"/>
      <rect x="0" y="0" width="22" height="29" rx="4" fill="#ff5a5a"/>
      <circle cx="11" cy="12.5" r="5.5" fill="#ffd43b" stroke-width="2.2"/>
      <path d="M5.5 12.5 H16.5 M11 7 Q7.5 12.5 11 18 M11 7 Q14.5 12.5 11 18" fill="none" stroke-width="1.6"/>
      <path d="M6 23 H16" fill="none" stroke="#ffd43b" stroke-width="2.4"/>
    </g>
  </g>
</svg>
