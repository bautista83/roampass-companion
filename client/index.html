<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#eaf2e6" />
    <title>Roamle · Viaja, adivina y explora</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Pixelify+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script>
      // Aplica el estilo del perfil (Comic u 80s) antes del primer render para evitar el destello.
      try {
        const retro = JSON.parse(localStorage.getItem('roampass-auth') || '{}').state?.user?.theme === 'RETRO';
        document.documentElement.classList.toggle('dark', retro);
        document.documentElement.classList.toggle('retro', retro);
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Navegadores (o WebView de Android) demasiado viejos para la interfaz (Tailwind 4 y JS moderno
      // necesitan Chrome 111 / Safari 16.4 o posterior): en lugar de una pantalla en blanco, un aviso.
      // Va en el HTML (sin i18n) porque tiene que funcionar justamente donde el bundle no corre.
      (function () {
        var ok = typeof [].at === 'function' && window.CSS && CSS.supports && CSS.supports('color', 'color-mix(in srgb, red, blue)');
        if (ok) return;
        var android = /Android/i.test(navigator.userAgent);
        var store = 'https://play.google.com/store/apps/details?id=com.google.android.webview';
        document.body.style.margin = '0';
        document.body.style.background = '#eaf2e6';
        document.body.innerHTML =
          '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:sans-serif;background:#eaf2e6;color:#111">' +
          '<div style="max-width:420px;text-align:center;background:#fff;border:3px solid #111;border-radius:24px;padding:24px;box-shadow:5px 5px 0 #111">' +
          '<img src="/logo.svg" alt="" width="72" height="72" style="margin:0 auto 12px;display:block">' +
          '<h1 style="font-size:22px;margin:0 0 8px">Hay que actualizar el navegador</h1>' +
          (android
            ? '<p style="margin:0 0 16px;line-height:1.4">Roamle necesita una versión más nueva de <b>Android System WebView</b>. Actualízala desde Google Play y vuelve a abrir la app.</p>' +
              '<a href="' + store + '" style="display:inline-block;background:#111;color:#fff;padding:12px 20px;border-radius:16px;font-weight:bold;text-decoration:none">Actualizar en Google Play</a>'
            : '<p style="margin:0;line-height:1.4">Roamle necesita un navegador más nuevo. Actualiza Chrome, Safari, Edge o Firefox y vuelve a entrar.</p>') +
          '</div></div>';
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
